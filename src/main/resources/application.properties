# Every deployment value comes from an environment variable through Spring's
# relaxed binding (spring.mail.host <- SPRING_MAIL_HOST, domain <- DOMAIN, ...).
# This file holds only safe, non-secret defaults; README lists every variable.

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.javax.persistence.validation.mode = none

# Database (required): SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD

# SERVER_PORT
server.port=8080
server.servlet.session.cookie.same-site=strict

# Cookie domain of the login cookies (required): DOMAIN

# Canvas starts from 0,0 and ends at 399,399 (400x400): CANVAS_MAX_PIXEL_X, CANVAS_MAX_PIXEL_Y
canvas.max.pixel.x=399
canvas.max.pixel.y=399

# PLACE_LOGIN_MODE: how people log in: mail (a link mailed to the school address),
# eskylab or both. Any other value stops the application from starting.
place.login.mode=mail
# PLACE_LOGIN_LINK_TTL: how long a mailed login link works
place.login.link-ttl=1h
# PLACE_LOGIN_LINK_SINGLE_USE: true lets a mailed link log in once; false (for now) lets it log in
# again until it expires, since a mail scanner may open it before the student does. Every use
# opens a new session; the link itself never becomes the cookie.
place.login.link-single-use=false
# PLACE_ELEVATED_SESSION_TTL: how long a session with admin or moderator rights lasts. Those rights
# come only from the Keycloak client roles place:admin and place:moderator at an e-skylab login
# (ADR 0060). Afterwards the session ends (401) and a new login reads the roles again, so a role
# taken away in Keycloak is gone within this time. Other sessions are not affected.
place.elevated-session-ttl=8h

# e-skylab login (ADR 0060): the backend is Keycloak's confidential client and runs the
# authorization code flow with PKCE. Keycloak's endpoints come from the issuer's discovery document.
# KEYCLOAK_ISSUER, KEYCLOAK_CLIENT_ID, KEYCLOAK_REDIRECT_URI (this backend's callback) and
# PLACE_FRONTEND_URL (where a login ends) default to production. The client secret has no default:
# KEYCLOAK_CLIENT_SECRET (an OpenBao reference in Dokploy). Without it the backend still starts and
# the mail login works; /api/auth/eskylab answers 503.
keycloak.issuer=https://e.yildizskylab.com/realms/e-skylab
keycloak.client-id=place
keycloak.redirect-uri=https://api.place.yildizskylab.com/api/auth/eskylab/callback
place.frontend-url=https://place.yildizskylab.com

# SCHOOL_MAIL_ENABLED: only @std.yildiz.edu.tr addresses may log in and place pixels
school.mail.enabled=true
# FINAL_PIXEL_ENABLED
final.pixel.enabled=false

# Mail goes over SMTP only.
# Required: SPRING_MAIL_HOST, SPRING_MAIL_USERNAME (also the sender address), SPRING_MAIL_PASSWORD
# SPRING_MAIL_PORT, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudflare Turnstile secret key (required): TURNSTILE_SECRET_KEY
