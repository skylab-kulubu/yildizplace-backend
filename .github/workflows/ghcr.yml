name: GHCR

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers starts Postgres 17 on the runner's Docker.
      - run: mvn -B verify

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yildizplace
          POSTGRES_USER: yildizplace
          POSTGRES_PASSWORD: ci-probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yildizplace -d yildizplace"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: yildizplace-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot against Postgres and probe HTTP
        run: |
          docker run -d --name app --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/yildizplace \
            -e SPRING_DATASOURCE_USERNAME=yildizplace \
            -e SPRING_DATASOURCE_PASSWORD=ci-probe \
            -e SPRING_MAIL_HOST=smtp.invalid \
            -e SPRING_MAIL_USERNAME=probe@example.invalid \
            -e SPRING_MAIL_PASSWORD=ci-probe \
            -e TURNSTILE_SECRET_KEY=ci-probe \
            -e DOMAIN=localhost \
            yildizplace-backend:ci
          # Public and backed by the database: 200 means the app booted and reached Postgres.
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/pixels/getColors || true)
            if [ "$code" = 200 ]; then
              echo "GET /api/pixels/getColors -> 200"
              exit 0
            fi
            sleep 2
          done
          echo "GET /api/pixels/getColors never returned 200 (last: $code)"
          docker logs app
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the probed image to GHCR
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          img=ghcr.io/skylab-kulubu/yildizplace-backend
          if [ "$REF_NAME" = production ]; then
            tags="production $SHA"
          else
            tags="latest $SHA"
          fi
          for tag in $tags; do
            docker tag yildizplace-backend:ci "$img:$tag"
            docker push "$img:$tag"
          done
      - name: Notify Dokploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_DEPLOY_HOOK unset; skip"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
